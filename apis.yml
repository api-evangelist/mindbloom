aid: mindbloom
name: Mindbloom
description: Mindbloom is a direct-to-consumer telehealth company offering at-home ketamine-assisted
  therapy for anxiety, depression, and PTSD, combining psychiatric clinician oversight, guided
  therapeutic sessions, and peer support. Clients complete a psychiatric evaluation, receive
  either sublingual tablets or subcutaneous injectable treatments, and are supported through
  a structured program with monitoring and integration guidance. The company reports having
  facilitated over 200,000 ketamine therapy sessions. Surfaced as a portfolio company of 8vc
  and added to the API Evangelist network; enrichment found no public API, developer platform,
  or developer documentation — Mindbloom is a consumer healthcare service, not an API provider.
